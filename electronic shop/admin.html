<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel — ElectricHub</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>
  <div id="navbar"></div>

  <div class="page-wrapper">
    <div class="container admin-wrap">

      <!-- Login Screen -->
      <div id="loginScreen" class="admin-login">
        <div class="lock-icon">🔐</div>
        <h2>Admin Panel</h2>
        <p>Enter the admin password to continue</p>
        <div class="form-group">
          <input type="password" id="adminPassword" class="form-control" placeholder="Enter password…"
                 onkeydown="if(event.key==='Enter') attemptLogin()" style="text-align:center;font-size:1.1rem;letter-spacing:4px">
        </div>
        <button class="btn btn-primary" style="width:100%;justify-content:center" onclick="attemptLogin()">🔓 Login</button>
        <p style="color:var(--text-muted);font-size:0.8rem;margin-top:1rem">Default password: <code style="color:var(--amber)">admin123</code></p>
        <p id="loginError" class="text-red hidden" style="margin-top:0.75rem;font-size:0.88rem">❌ Incorrect password. Try again.</p>
      </div>

      <!-- Admin Dashboard -->
      <div id="adminDash" class="hidden">
        <!-- Header -->
        <div class="admin-header">
          <div>
            <h1>⚡ Admin Panel</h1>
            <p style="color:var(--text-muted);font-size:0.88rem">Manage your product catalogue</p>
          </div>
          <div style="display:flex;gap:0.75rem;flex-wrap:wrap">
            <button class="btn btn-primary btn-sm" onclick="openModal()">+ Add Product</button>
            <button class="btn btn-secondary btn-sm" onclick="logout()">🚪 Logout</button>
          </div>
        </div>

        <!-- Stats -->
        <div class="admin-stats" id="adminStats"></div>

        <!-- Table -->
        <div class="admin-table-wrap">
          <table class="admin-table" id="adminTable">
            <thead>
              <tr>
                <th>#</th>
                <th>Image</th>
                <th>Product Name</th>
                <th>Category</th>
                <th>Brand</th>
                <th>Price</th>
                <th>Stock</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="adminTableBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Add/Edit Product Modal -->
  <div class="modal-overlay hidden" id="productModal" onclick="closeModalOnOverlay(event)">
    <div class="modal">
      <div class="modal-header">
        <h2 class="modal-title" id="modalTitle">Add Product</h2>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>

      <form id="productForm" onsubmit="saveProduct(event)">
        <input type="hidden" id="editProductId">

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem">
          <div class="form-group" style="grid-column:1/-1">
            <label for="pName">Product Name *</label>
            <input type="text" id="pName" class="form-control" placeholder="e.g. LED Bulb 9W" required>
          </div>
          <div class="form-group">
            <label for="pCategory">Category *</label>
            <select id="pCategory" class="form-control" required>
              <option value="">Select Category</option>
              <option value="Lights">💡 Lights</option>
              <option value="Fans">🌀 Fans</option>
              <option value="Switches">🔌 Switches</option>
              <option value="Wires">🔶 Wires</option>
              <option value="Tools">🔧 Tools</option>
            </select>
          </div>
          <div class="form-group">
            <label for="pBrand">Brand *</label>
            <input type="text" id="pBrand" class="form-control" placeholder="e.g. Philips" required>
          </div>
          <div class="form-group">
            <label for="pPrice">Price (₹) *</label>
            <input type="number" id="pPrice" class="form-control" placeholder="0" min="0" required>
          </div>
          <div class="form-group">
            <label for="pStock">Stock Quantity *</label>
            <input type="number" id="pStock" class="form-control" placeholder="0" min="0" required>
          </div>
          <div class="form-group" style="grid-column:1/-1">
            <label for="pImage">Image Path</label>
            <select id="pImage" class="form-control">
              <option value="images/led_bulb.png">💡 LED Bulb (default)</option>
              <option value="images/ceiling_fan.png">🌀 Ceiling Fan</option>
              <option value="images/electric_switch.png">🔌 Switch</option>
              <option value="images/electric_wire.png">🔶 Wire</option>
              <option value="images/extension_board.png">🔷 Extension Board</option>
            </select>
          </div>
          <div class="form-group" style="grid-column:1/-1">
            <label for="pDescription">Description *</label>
            <textarea id="pDescription" class="form-control" rows="4"
                      placeholder="Write a product description…" required
                      style="resize:vertical;min-height:100px"></textarea>
          </div>
        </div>

        <div style="display:flex;gap:0.75rem;margin-top:0.5rem">
          <button type="submit" class="btn btn-primary" style="flex:1;justify-content:center">💾 Save Product</button>
          <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Delete Confirm Modal -->
  <div class="modal-overlay hidden" id="deleteModal">
    <div class="modal" style="max-width:400px;text-align:center">
      <div style="font-size:3rem;margin-bottom:1rem">🗑️</div>
      <h2 style="font-size:1.4rem;font-weight:800;margin-bottom:0.75rem">Delete Product?</h2>
      <p style="color:var(--text-muted);font-size:0.9rem;margin-bottom:1.5rem" id="deleteProductName"></p>
      <div style="display:flex;gap:0.75rem;justify-content:center">
        <button class="btn btn-danger" onclick="confirmDelete()">🗑️ Yes, Delete</button>
        <button class="btn btn-secondary" onclick="closeDeleteModal()">Cancel</button>
      </div>
    </div>
  </div>

  <div id="footer"></div>

  <script src="js/data.js"></script>
  <script>
    document.getElementById('navbar').innerHTML = renderNavbar('admin.html');
    document.getElementById('footer').innerHTML = renderFooter();

    const ADMIN_PASS = 'admin123';
    let deleteTargetId = null;

    // ── Auth ──
    function attemptLogin() {
      const pw = document.getElementById('adminPassword').value;
      if (pw === ADMIN_PASS) {
        sessionStorage.setItem('adminAuth', '1');
        showDash();
      } else {
        document.getElementById('loginError').classList.remove('hidden');
        document.getElementById('adminPassword').value = '';
        document.getElementById('adminPassword').focus();
      }
    }

    function logout() {
      sessionStorage.removeItem('adminAuth');
      document.getElementById('adminDash').classList.add('hidden');
      document.getElementById('loginScreen').classList.remove('hidden');
      document.getElementById('adminPassword').value = '';
    }

    function showDash() {
      document.getElementById('loginScreen').classList.add('hidden');
      document.getElementById('adminDash').classList.remove('hidden');
      renderStats();
      renderTable();
    }

    // Auto-login if session exists
    if (sessionStorage.getItem('adminAuth') === '1') showDash();

    // ── Stats ──
    function renderStats() {
      const products = getProducts();
      const totalValue = products.reduce((s, p) => s + p.price * p.stock, 0);
      const cats = new Set(products.map(p => p.category)).size;
      const lowStock = products.filter(p => p.stock <= 10).length;

      document.getElementById('adminStats').innerHTML = `
        <div class="admin-stat">
          <div class="admin-stat-val">${products.length}</div>
          <div class="admin-stat-label">Total Products</div>
        </div>
        <div class="admin-stat">
          <div class="admin-stat-val">${cats}</div>
          <div class="admin-stat-label">Categories</div>
        </div>
        <div class="admin-stat">
          <div class="admin-stat-val" style="color:var(--amber)">₹${(totalValue/1000).toFixed(0)}K</div>
          <div class="admin-stat-label">Inventory Value</div>
        </div>
        <div class="admin-stat">
          <div class="admin-stat-val" style="color:${lowStock>0?'var(--red)':'var(--green)'}">${lowStock}</div>
          <div class="admin-stat-label">Low Stock Items</div>
        </div>
      `;
    }

    // ── Table ──
    function renderTable() {
      const products = getProducts();
      const tbody = document.getElementById('adminTableBody');

      if (products.length === 0) {
        tbody.innerHTML = `<tr><td colspan="8" style="text-align:center;padding:3rem;color:var(--text-muted)">No products found. Add your first product!</td></tr>`;
        return;
      }

      tbody.innerHTML = products.map((p, i) => `
        <tr>
          <td>${i + 1}</td>
          <td>
            <img src="${p.image}" alt="${p.name}" class="product-thumb"
                 onerror="this.src='images/led_bulb.png'">
          </td>
          <td style="font-weight:600;color:var(--text-primary);max-width:200px">${p.name}</td>
          <td><span class="badge badge-blue">${p.category}</span></td>
          <td>${p.brand}</td>
          <td style="font-weight:700;color:var(--amber)">₹${Number(p.price).toLocaleString('en-IN')}</td>
          <td>${getStockBadge(p.stock)}</td>
          <td>
            <div style="display:flex;gap:0.5rem;flex-wrap:wrap">
              <button class="btn btn-primary btn-sm" onclick="editProduct(${p.id})">✏️ Edit</button>
              <button class="btn btn-danger" onclick="promptDelete(${p.id}, '${p.name.replace(/'/g,"\\'")}')">🗑️</button>
            </div>
          </td>
        </tr>
      `).join('');
    }

    // ── Modal (Add/Edit) ──
    function openModal(productId = null) {
      const modal = document.getElementById('productModal');
      const title = document.getElementById('modalTitle');
      const form = document.getElementById('productForm');
      form.reset();
      document.getElementById('editProductId').value = '';

      if (productId) {
        const p = getProductById(productId);
        if (!p) return;
        title.textContent = 'Edit Product';
        document.getElementById('editProductId').value = p.id;
        document.getElementById('pName').value = p.name;
        document.getElementById('pCategory').value = p.category;
        document.getElementById('pBrand').value = p.brand;
        document.getElementById('pPrice').value = p.price;
        document.getElementById('pStock').value = p.stock;
        document.getElementById('pImage').value = p.image;
        document.getElementById('pDescription').value = p.description;
      } else {
        title.textContent = 'Add New Product';
      }

      modal.classList.remove('hidden');
    }

    function editProduct(id) { openModal(id); }

    function closeModal() {
      document.getElementById('productModal').classList.add('hidden');
    }

    function closeModalOnOverlay(e) {
      if (e.target === document.getElementById('productModal')) closeModal();
    }

    function saveProduct(e) {
      e.preventDefault();
      const id = document.getElementById('editProductId').value;

      const data = {
        name: document.getElementById('pName').value.trim(),
        category: document.getElementById('pCategory').value,
        brand: document.getElementById('pBrand').value.trim(),
        price: parseInt(document.getElementById('pPrice').value),
        stock: parseInt(document.getElementById('pStock').value),
        image: document.getElementById('pImage').value,
        description: document.getElementById('pDescription').value.trim(),
        specs: {}
      };

      if (id) {
        updateProduct(parseInt(id), data);
        showToast('Product updated successfully!', 'success');
      } else {
        addProduct(data);
        showToast('Product added successfully!', 'success');
      }

      closeModal();
      renderStats();
      renderTable();
    }

    // ── Delete ──
    function promptDelete(id, name) {
      deleteTargetId = id;
      document.getElementById('deleteProductName').textContent = `"${name}" will be permanently deleted.`;
      document.getElementById('deleteModal').classList.remove('hidden');
    }

    function confirmDelete() {
      if (deleteTargetId !== null) {
        deleteProduct(deleteTargetId);
        showToast('Product deleted.', 'success');
        deleteTargetId = null;
        closeDeleteModal();
        renderStats();
        renderTable();
      }
    }

    function closeDeleteModal() {
      document.getElementById('deleteModal').classList.add('hidden');
      deleteTargetId = null;
    }
  </script>
</body>
</html>
