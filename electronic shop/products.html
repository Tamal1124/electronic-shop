<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Products — ElectricHub</title>
  <meta name="description" content="Browse all electrical products at ElectricHub — LED bulbs, fans, switches, wires, extension boards and more. Best prices guaranteed.">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>
  <div id="navbar"></div>

  <div class="page-wrapper">
    <!-- Hero -->
    <div class="products-page-hero">
      <div class="container">
        <div class="breadcrumb">
          <a href="index.html">Home</a>
          <span class="sep">›</span>
          <span>Products</span>
        </div>
        <h1 class="page-hero-title animate-in">All Products</h1>
        <p class="page-hero-subtitle animate-in animate-in-delay-1">Browse our complete range of electrical products</p>
      </div>
    </div>

    <div class="container">
      <!-- Filter Bar -->
      <div class="filter-bar mt-3" id="filterBar">
        <div class="search-input">
          <span class="search-icon">🔍</span>
          <input type="text" id="searchInput" placeholder="Search products…" oninput="filterProducts()">
        </div>
        <select id="catFilter" class="form-control" onchange="filterProducts()" style="min-width:160px">
          <option value="">All Categories</option>
        </select>
        <select id="sortFilter" class="form-control" onchange="filterProducts()" style="min-width:160px">
          <option value="">Sort By</option>
          <option value="price-asc">Price: Low to High</option>
          <option value="price-desc">Price: High to Low</option>
          <option value="name-asc">Name: A to Z</option>
          <option value="stock-desc">Highest Stock</option>
        </select>
      </div>

      <!-- Count -->
      <div class="products-count" id="productsCount"></div>

      <!-- Products Grid -->
      <div class="products-grid" id="productsGrid"></div>

      <!-- Empty State -->
      <div class="empty-state hidden" id="emptyState">
        <div class="icon">🔍</div>
        <h3>No products found</h3>
        <p>Try adjusting your search or filter criteria.</p>
        <button class="btn btn-primary mt-2" onclick="clearFilters()">Clear Filters</button>
      </div>

      <div style="padding-bottom:4rem"></div>
    </div>
  </div>

  <div id="footer"></div>

  <script src="js/data.js"></script>
  <script>
    document.getElementById('navbar').innerHTML = renderNavbar('products.html');
    document.getElementById('footer').innerHTML = renderFooter();

    // Populate category filter
    const catFilter = document.getElementById('catFilter');
    getCategories().forEach(cat => {
      catFilter.innerHTML += `<option value="${cat}">${cat}</option>`;
    });

    function filterProducts() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const cat = document.getElementById('catFilter').value;
      const sort = document.getElementById('sortFilter').value;

      let results = getProducts();

      // Filter by search
      if (search) {
        results = results.filter(p =>
          p.name.toLowerCase().includes(search) ||
          p.brand.toLowerCase().includes(search) ||
          p.category.toLowerCase().includes(search) ||
          p.description.toLowerCase().includes(search)
        );
      }

      // Filter by category
      if (cat) results = results.filter(p => p.category === cat);

      // Sort
      if (sort === 'price-asc') results.sort((a, b) => a.price - b.price);
      else if (sort === 'price-desc') results.sort((a, b) => b.price - a.price);
      else if (sort === 'name-asc') results.sort((a, b) => a.name.localeCompare(b.name));
      else if (sort === 'stock-desc') results.sort((a, b) => b.stock - a.stock);

      renderProducts(results);
    }

    function renderProducts(products) {
      const grid = document.getElementById('productsGrid');
      const empty = document.getElementById('emptyState');
      const count = document.getElementById('productsCount');

      if (products.length === 0) {
        grid.innerHTML = '';
        empty.classList.remove('hidden');
        count.innerHTML = '';
      } else {
        empty.classList.add('hidden');
        count.innerHTML = `Showing <strong>${products.length}</strong> products`;
        grid.innerHTML = products.map(p => buildProductCard(p)).join('');
      }
    }

    function clearFilters() {
      document.getElementById('searchInput').value = '';
      document.getElementById('catFilter').value = '';
      document.getElementById('sortFilter').value = '';
      filterProducts();
    }

    // Check for ?cat= URL param
    const urlParams = new URLSearchParams(window.location.search);
    const presetCat = urlParams.get('cat');
    if (presetCat) {
      document.getElementById('catFilter').value = presetCat;
    }

    filterProducts();
  </script>
</body>
</html>
