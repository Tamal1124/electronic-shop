<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Details — ElectricHub</title>
  <meta name="description" content="Detailed product information, specifications, and availability at ElectricHub.">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>
  <div id="navbar"></div>

  <div class="page-wrapper">
    <div class="container">
      <!-- Breadcrumb injected by JS -->
      <div id="breadcrumbWrap" style="padding-top:2.5rem"></div>

      <!-- Product Detail injected by JS -->
      <div id="productDetail"></div>

      <!-- Related Products -->
      <div class="divider"></div>
      <div class="section-header">
        <div class="section-label">More Like This</div>
        <h2 class="section-title">Related <span class="highlight">Products</span></h2>
      </div>
      <div class="products-grid" id="relatedGrid"></div>

      <div style="padding-bottom:4rem"></div>
    </div>
  </div>

  <div id="footer"></div>

  <script src="js/data.js"></script>
  <script>
    document.getElementById('navbar').innerHTML = renderNavbar('products.html');
    document.getElementById('footer').innerHTML = renderFooter();

    const params = new URLSearchParams(window.location.search);
    const productId = params.get('id');
    const product = getProductById(productId);

    if (!product) {
      document.getElementById('productDetail').innerHTML = `
        <div class="empty-state" style="padding:6rem 0">
          <div class="icon">⚠️</div>
          <h3>Product Not Found</h3>
          <p>The product you're looking for doesn't exist or was removed.</p>
          <a href="products.html" class="btn btn-primary mt-2">← Back to Products</a>
        </div>
      `;
    } else {
      // Update page title
      document.title = `${product.name} — ElectricHub`;

      // Breadcrumb
      document.getElementById('breadcrumbWrap').innerHTML = `
        <div class="breadcrumb">
          <a href="index.html">Home</a>
          <span class="sep">›</span>
          <a href="products.html">Products</a>
          <span class="sep">›</span>
          <a href="category.html?cat=${product.category}">${product.category}</a>
          <span class="sep">›</span>
          <span>${product.name}</span>
        </div>
      `;

      // Build specs rows
      const specsRows = Object.entries(product.specs || {}).map(([k, v]) => `
        <tr>
          <th>${k}</th>
          <td>${v}</td>
        </tr>
      `).join('');

      // WhatsApp enquiry message
      const waMsg = encodeURIComponent(`Hi, I'm interested in "${product.name}" (${formatPrice(product.price)}). Is it available?`);

      document.getElementById('productDetail').innerHTML = `
        <div class="product-detail-grid animate-in">
          <div class="product-detail-img-wrap">
            <img src="${product.image}" alt="${product.name}" onerror="this.src='images/led_bulb.png'">
          </div>
          <div class="product-detail-info">
            <div class="product-detail-category">${product.category}</div>
            <h1 class="product-detail-name">${product.name}</h1>
            <div class="product-detail-brand">Brand: <strong>${product.brand}</strong></div>
            <div style="margin-bottom:1.2rem">${getStockBadge(product.stock)}</div>
            <div class="product-detail-price">
              <span class="currency">₹</span>${Number(product.price).toLocaleString('en-IN')}
            </div>
            <p class="product-detail-desc">${product.description}</p>

            ${specsRows ? `
              <h3 style="font-size:1rem;font-weight:700;margin-bottom:0.75rem;color:var(--text-secondary)">SPECIFICATIONS</h3>
              <table class="specs-table">
                <tbody>${specsRows}</tbody>
              </table>
            ` : ''}

            <div class="product-actions">
              <a href="https://wa.me/919876543210?text=${waMsg}" target="_blank" class="btn btn-green">
                💬 WhatsApp Enquiry
              </a>
              <a href="contact.html" class="btn btn-secondary">📞 Call for Price</a>
            </div>
          </div>
        </div>
      `;

      // Related products (same category, excluding current)
      const related = getProductsByCategory(product.category)
        .filter(p => p.id !== product.id)
        .slice(0, 4);
      const relatedGrid = document.getElementById('relatedGrid');
      if (related.length > 0) {
        relatedGrid.innerHTML = related.map(p => buildProductCard(p)).join('');
      } else {
        relatedGrid.innerHTML = '<p class="text-muted">No related products found.</p>';
      }
    }
  </script>
</body>
</html>
